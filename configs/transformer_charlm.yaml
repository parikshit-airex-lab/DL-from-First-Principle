# Decoder-only (causal) Transformer character-level language model.
model:
  name: transformer
  params:
    d_model: 256
    n_heads: 4
    n_layers: 4
    d_ff: 1024
    dropout: 0.1
    max_seq_len: 512
    pos_encoding: sinusoidal
    mode: lm
    tie_weights: true

data:
  name: charlm
  batch_size: 64
  params:
    block_size: 128

train:
  epochs: 10
  optimizer: adam
  lr: 3.0e-4
  scheduler: cosine
  warmup_steps: 500
